services:
  - type: web
    name: casa-pia-live
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: ./data
      - key: OUTPUT_DIR
        value: ./outputs
      - key: GOOGLE_DRIVE_FILE_ID
        value: 1jpwKSi1aY9-aKmm_edFA5Bm137xWrgnA
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CASA_PIA_XLSX_URL
        sync: false
      - key: CASA_PIA_AUTO_SYNC_MINUTES
        value: "5"
      - key: CASA_PIA_EXCEL_SEASON
        value: "2025/2026"
      - key: ZEROZERO_AUTO_SYNC_MINUTES
        value: "0"
      - key: ZEROZERO_AUTO_SYNC_SEASON
        value: "2024/2025"
      - key: ZEROZERO_AUTO_SYNC_UNTIL_CURRENT
        value: "1"
